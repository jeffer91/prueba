<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centro de respaldos</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#111827}
main{width:min(620px,92%);margin:48px auto}
h1{font-size:28px;margin:0 0 6px}
p{margin:0 0 18px;color:#6b7280;font-size:14px;line-height:1.45}
.box{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;box-shadow:0 8px 24px rgba(15,23,42,.05)}
label{display:block;font-size:12px;font-weight:700;color:#475569;margin:0 0 6px}
select,input,button{width:100%;height:42px;border-radius:9px;font-size:14px}
select,input{border:1px solid #d1d5db;background:#fff;padding:0 10px;margin-bottom:10px}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0 14px}
.pill{font-size:11px;font-weight:700;padding:5px 8px;border-radius:999px;background:#eef2ff;color:#3730a3}
.pill.ok{background:#dcfce7;color:#166534}.pill.wait{background:#fef3c7;color:#92400e}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{border:0;font-weight:700;cursor:pointer}
.txt{background:#eef2ff;color:#1d4ed8}.xls{background:#dcfce7;color:#047857}
button:disabled{opacity:.5;cursor:not-allowed}
#status{margin-top:12px;padding:10px 11px;border-radius:9px;background:#f8fafc;font-size:12px;color:#475569;min-height:36px;line-height:1.4}
.hint{font-size:11px;color:#64748b;margin:0 0 10px}
@media(max-width:460px){.row{grid-template-columns:1fr}main{margin:28px auto}}
</style>
</head>
<body>
<main>
  <h1>Centro de respaldos</h1>
  <p>Firebase, Supabase y Neon en un solo lugar. Las conexiones respetan las reglas de acceso de cada plataforma.</p>
  <div class="box">
    <label for="base">Base de datos</label>
    <select id="base"></select>
    <div class="meta" id="meta"></div>
    <div id="extraWrap" hidden>
      <label for="extra">Colecciones adicionales</label>
      <input id="extra" placeholder="Ej.: docentes, defensas, configuracion">
      <div class="hint">Útil cuando Firestore no permite descubrir colecciones raíz desde el navegador.</div>
    </div>
    <div class="row">
      <button id="txt" class="txt">Descargar TXT</button>
      <button id="xls" class="xls">Descargar Excel</button>
    </div>
    <div id="status">Selecciona una base.</div>
  </div>
</main>
