<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Respaldo Firebase</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#111827}
main{width:min(520px,92%);margin:55px auto}
h1{font-size:28px;margin:0 0 6px}
p{margin:0 0 18px;color:#6b7280;font-size:14px}
.box{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px}
select,button{width:100%;height:42px;border-radius:9px;font-size:14px}
select{border:1px solid #d1d5db;background:#fff;padding:0 10px;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{border:0;font-weight:700;cursor:pointer}
.txt{background:#eef2ff;color:#1d4ed8}
.xls{background:#dcfce7;color:#047857}
button:disabled{opacity:.5;cursor:wait}
#status{margin-top:10px;font-size:12px;color:#6b7280;min-height:16px}
@media(max-width:420px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>Respaldo Firebase</h1>
  <p>Selecciona una base y descarga su respaldo.</p>

  <div class="box">
    <select id="base">
      <option value="titulos">Títulos</option>
      <option value="utet">UTET</option>
      <option value="repaso">Repaso-Fire</option>
    </select>

    <div class="row">
      <button id="txt" class="txt">Descargar TXT</button>
      <button id="xls" class="xls">Descargar Excel</button>
    </div>

    <div id="status"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,collection,getDocs} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {getDatabase,ref,get} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const bases={
  titulos:{
    type:"firestore",
    projectId:"titulos-ec2fa",
    collections:["admin_vista_periodos","carreras","configuracion","coordinadores","envios"]
  },
  utet:{
    type:"firestore",
    projectId:"utet-4387a",
    collections:["Estudiante","carreras","historial","importaciones","matriculas","periodos","requisitos"]
  },
  repaso:{
    type:"realtime",
    projectId:"repaso-fire-d8ceb",
    databaseURL:"https://repaso-fire-d8ceb-default-rtdb.firebaseio.com"
  }
};

const apps={
  titulos:initializeApp({projectId:bases.titulos.projectId},"titulos"),
  utet:initializeApp({projectId:bases.utet.projectId},"utet"),
  repaso:initializeApp({projectId:bases.repaso.projectId,databaseURL:bases.repaso.databaseURL},"repaso")
};

const select=document.getElementById("base");
const status=document.getElementById("status");
const txtBtn=document.getElementById("txt");
const xlsBtn=document.getElementById("xls");

function busy(v){
  txtBtn.disabled=v;
  xlsBtn.disabled=v;
  status.textContent=v?"Leyendo base de datos…":"";
}

function clean(v){
  if(v===null||v===undefined)return v;
  if(Array.isArray(v))return v.map(clean);
  if(typeof v==="object"){
    if(typeof v.toDate==="function"){try{return v.toDate().toISOString()}catch{}}
    const o={};
    for(const [k,x] of Object.entries(v))o[k]=clean(x);
    return o;
  }
  return v;
}

async function readBase(key){
  const cfg=bases[key];

  if(cfg.type==="realtime"){
    const snap=await get(ref(getDatabase(apps[key]),"/"));
    return clean(snap.val());
  }

  const db=getFirestore(apps[key]);
  const out={};
  const errors={};

  for(const name of cfg.collections){
    try{
      const snap=await getDocs(collection(db,name));
      out[name]=snap.docs.map(d=>({id:d.id,...clean(d.data())}));
    }catch(e){
      errors[name]=e?.message||String(e);
    }
  }

  if(Object.keys(errors).length)out._errores=errors;
  return out;
}

function stamp(){
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"_"+p(d.getHours())+p(d.getMinutes());
}

function saveBlob(content,name,type){
  const u=URL.createObjectURL(new Blob([content],{type}));
  const a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
}

function flatten(obj,p="",out={}){
  for(const [k,v] of Object.entries(obj||{})){
    const key=p?p+"."+k:k;
    if(v&&typeof v==="object"&&!Array.isArray(v))flatten(v,key,out);
    else out[key]=Array.isArray(v)?JSON.stringify(v):v;
  }
  return out;
}

function rows(v){
  if(Array.isArray(v))return v.map(x=>flatten(x&&typeof x==="object"?x:{valor:x}));
  if(v&&typeof v==="object")return Object.entries(v).map(([id,x])=>flatten({id,...(x&&typeof x==="object"?x:{valor:x})}));
  return [{valor:v}];
}

async function exportBase(format){
  busy(true);
  const key=select.value;

  try{
    const data=await readBase(key);
    const name=bases[key].projectId+"_"+stamp();

    if(format==="txt"){
      saveBlob("\ufeff"+JSON.stringify(data,null,2),name+".txt","text/plain;charset=utf-8");
    }else{
      const wb=XLSX.utils.book_new();

      if(data&&typeof data==="object"&&!Array.isArray(data)){
        for(const [sheet,value] of Object.entries(data)){
          const r=rows(value);
          XLSX.utils.book_append_sheet(
            wb,
            XLSX.utils.json_to_sheet(r.length?r:[{sin_datos:""}]),
            sheet.slice(0,31)
          );
        }
      }

      if(!wb.SheetNames.length){
        XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([{sin_datos:""}]),"datos");
      }

      XLSX.writeFile(wb,name+".xlsx");
    }

    status.textContent="Descarga lista.";
  }catch(e){
    status.textContent="No se pudo leer la base: "+(e?.message||String(e));
  }finally{
    txtBtn.disabled=false;
    xlsBtn.disabled=false;
  }
}

txtBtn.onclick=()=>exportBase("txt");
xlsBtn.onclick=()=>exportBase("xls");
</script>
</body>
</html>
